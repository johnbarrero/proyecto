<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .header{
            .nav{
                color: red;
            }
            .formulario{
                .datos__correo, .datos__contraseña{
                    font-size: 50px
                }
                .form{
                    color: blueviolet;
                }
            }
    }
    </style>
</head>
<body>
    <header class="header">
        <img src="img/logo.png" width="400" class="header__logo" alt="logotipo">
        <nav class="nav">
            <a href="#" class="nav__link">Inicio</a> 
            <a href="#" class="nav__link">Página</a>
            <a href="#formulario" class="nav__link">Formulario</a>
            <a href="#" class="nav__link">Contacto</a>
        </nav>
        <div class="formulario">
            <h1 id="formulario" class="titulo__formulario">Inicio Sesión</h1>
            <fieldset class="form">
                <div class="datos">
                    <legend>Datos del usuario</legend>
                    <label class="datos__correo">
                        correo electronico
                        <input type="email" name="correo">
                    </label>
                    <label class="datos__contraseña">
                        Contraseña
                        <input type="password" name="contraseña">
                    </label>
                </div>
            </fieldset>
        </div>
    </header>
</body>
</html>
