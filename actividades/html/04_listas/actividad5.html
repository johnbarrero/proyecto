<h1>Los dinosaurios mas grandes de la historia</h1>
<dl>
    <dt>Patagotitan mayorum</dt>
    <dd>40m de largo. Alrededor de 70 toneladas</dd>
    <dt>Argentinosaurus huinculensis</dt>
    <dd>Hasta 35m de largo. Varían entre 65 y 90 toneladas</dd>
    <dt>Supersaurus</dt>
    <dd>Llega a alcanzar los 40m</dd>

</dl>
