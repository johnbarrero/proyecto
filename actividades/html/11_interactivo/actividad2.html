<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Buscador de Smartphone</h1>
    <label>
        Escribe la marca:
        <input list="marca-smartphone" type="text" name="marca">
    </label>

    <datalist id="marca-smartphone">
        <option value="Iphone"></option>
        <option value="Xiaomi"></option>
        <option value="Samsung"></option>
        <option value="Motorola"></option>
        <option value="Oppo AI Phone"></option>
    </datalist>
<br> 
</br>
    <label>Rango de precio</label>
    <select name="precio">
            <option value="1">De 100 a 200 </option>
            <option value="2">De 200 a 300 </option>
            <option value="3">De 300 a 400 </option>
            <option value="4">De 400 a 600 </option>
            <option value="5">De 600 a 1000 </option>
            <option value="6">De 1000 a 3000 </option>
        </select>
</body>
</html>
