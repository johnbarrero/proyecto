<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
        <header><h1>Formulario de Registro</h1></header>
    <main>
        <form>
            <p><label for="nombre" >Nombre: 
                <input type="text" id="nombre" required>
            </label></p>
            <p><label for="apellidos">Apellidos
                <input type="text" id="apellidos">
            </label>
            </p>
        <p>
            <label for="fecha-nacimiento">Fecha de nacimiento
                <input type="date" id="fecha-nacimiento" required>
            </label>
        </p>
        <p>
            <label for="email">Correo electronico
                <input type="email" id="email" required>
            </label>
        </p>
        <p><label for="terminos-y-condiciones"> Acepto los Términos y Condiciones
            <input type="checkbox" id="terminos-y-condiciones" required>
        </label>
        </p>
        <p>
            <button id="enviar">Enviar Registro</button>
        </p>
        </form>
    </main>
</body>
</html>
