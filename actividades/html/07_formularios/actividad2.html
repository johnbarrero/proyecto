<h1>Venta de altavoces</h1>
<fieldset>

<select name="marca">
<option value="" aria-label="marca" disabled selected>Marca del altavoz</option>
<option value="0">JBL</option>
<option value="1">Xiaomi</option>
<option value="2">Sony</option>
<option value="3">Bose</option>
</select>

<option value="0">Si</option>

</select>
